        letter-spacing: 0.32em;
        fill: #C85A32;
        text-transform: uppercase;
      }
      .facade-location {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 600;
        font-size: 9px;
        letter-spacing: 0.18em;
        fill: #61776C;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <!-- Ombre portée douce comme sur l'enseigne en relief -->
  <text x="6" y="52" class="facade-shadow">MANOFICA</text>
  <!-- Lettres principales vert bouteille / sauge de la devanture -->
