<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&amp;display=swap');
      .facade-text {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: 0.14em;
        fill: #334D40;
      }
      .facade-shadow {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 800;
        font-size: 44px;
        letter-spacing: 0.14em;
        fill: #C6D8C8;
      }
      .facade-sub {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 700;
